name: Render MP4

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx remotion render src/index.ts ReflexionDialogo out/dialogo.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: dialogo-9x16
          path: out/dialogo.mp4
          retention-days: 14
