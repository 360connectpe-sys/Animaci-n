name: Render Paper Cut

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Composition id in src/papercut (e.g. PaperWalkTest)
        default: PaperWalkTest
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx remotion render src/papercut/index.ts "${{ inputs.composition }}" "out/${{ inputs.composition }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}
          path: out/${{ inputs.composition }}.mp4
          retention-days: 14
